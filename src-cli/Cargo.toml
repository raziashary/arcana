[package]
name = "arcanactl"
version = "1.0.0"
edition = "2021"
description = "arcanactl — Arcana headless CLI for automation, scripting, and CI/CD"
authors = ["Arcana"]

[[bin]]
name = "arcanactl"
path = "src/main.rs"

[dependencies]
arcana-shared = { path = "../src-shared" }

# The agent runtime, shared with the desktop app. INV-1: one runtime, two
# binaries. Linkable here only since P1 removed the tauri::AppHandle from every
# event emission (ADR-LOG-RESTRUCT-0011).
arcana-core = { path = "../arcana-core" }

# CLI framework
clap = { version = "4", features = ["derive", "env", "string"] }

# Interactive prompts
dialoguer = "0.11"

# Progress bars / spinners
indicatif = "0.17"

# Colored terminal output
colored = "2"

# Table formatting
comfy-table = "7"

# REPL / line editing with history
rustyline = { version = "14", features = ["with-fuzzy"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"

# Async
tokio  = { version = "1", features = ["full"] }
futures = "0.3"

# HTTP (for agent run — calls core-orchestrator)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Utilities
chrono   = { version = "0.4", features = ["serde"] }
uuid     = { version = "1", features = ["v4"] }
anyhow   = "1"

# Logging
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Backup / restore
zip = "2"

# Base64 (for setup token generation)
base64 = "0.22"

[dev-dependencies]
# The Provider trait core declares is an #[async_trait]; implementing a stub of
# it in tests needs the same macro.
async-trait = "0.1"
