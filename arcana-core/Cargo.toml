[package]
name = "arcana-core"
version = "1.0.0"
edition = "2021"
description = "Arcana's agent runtime, providers, memory and platform layer — shared by the desktop app and the CLI, and free of any UI framework."

[features]
# Semantic (vector) memory retrieval. OFF by default.
#
# ⚠ NOT available on macOS at any setting, and that is upstream, not a choice:
# Microsoft publishes no x86_64 macOS ONNX Runtime in any release from v1.25.0
# to v1.29.0, our DMG is a UNIVERSAL binary, and a universal binary needs both
# slices to link. Enabling this on macOS does not degrade Intel support — it
# fails the DMG build outright. `memory::manager` therefore compiles the vector
# backend out on macOS regardless of this flag, and memory falls back to
# FTS5/BM25 while REPORTING that it is degraded (spec 03 §4.4).
#
# Enabling this triggers a ~30 MB build-time download from a third-party CDN
# and a ~133 MB model download at first run:
#   cargo build -p arcana-core --features embeddings
embeddings = ["dep:fastembed"]

# The live provider smoke (P2-69). OFF by default and never enabled by the app.
#
# Fixture tests are the CI default because they need no credentials -- but a
# fixture is a photograph: it freezes the vendor wire format at capture time and
# goes on passing forever, including on the day a field is renamed. This feature
# gates the only tests that can see that drift, and the only ones that can prove
# prompt caching engages (usage.cached_read is not observable from the request).
#
# It spends real money. Run it deliberately:
#   cargo test -p arcana-core --features live-smoke --test live_provider_smoke -- --nocapture
live-smoke = []

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
anyhow      = "1"
tracing     = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rmcp = { version = "=3.5.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
chrono      = { version = "0.4", features = ["serde"] }
rusqlite    = { version = "0.31", features = ["bundled", "trace", "functions"] }
# P3-30. Vector search for memory. Its ENTIRE `[dependencies]` is `cc`:
# it compiles sqlite-vec.c with -DSQLITE_CORE and never touches
# libsqlite3-sys, so there is nothing to conflict with the pin above and
# `loadable_extension` never meets `bundled`. Verified before adoption.
# 0.1.9 is the latest stable; 0.1.10 is alpha.
sqlite-vec  = "0.1.9"

# ── Local embeddings (P3-32/33/34) · OPTIONAL, off by default ──────────────
#
# 🔴 razi-ruled 2026-09-02. `fastembed` pulls the ONNX Runtime from a
# third-party CDN (`cdn.pyke.io`) **at build time**, ~30 MB, and the flag that
# controls it is on `fastembed` — NOT on `ort`, which fastembed already depends
# on with `default-features = false`. P3-33's original prescription ("disable
# ort's default features") would therefore have changed nothing while looking
# like a fix. And disabling the download outright also drops `hf-hub`, which
# removes `TextEmbedding::try_new` — so there is no "no download, still loads
# models" configuration.
#
# The resolution: OFF BY DEFAULT. A default build and CI fetch nothing. The
# vendoring/hosting decision that would make this dependency ours rather than a
# third party's is Razi's to make before it enters a release build, rather than
# mine to make silently by adding it here.
#
# Pinned EXACTLY (`=`) rather than caret: a supply-chain surface is not
# something to let float.
fastembed = { version = "=6.0.2", optional = true }
reqwest     = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"
futures     = "0.3"
uuid        = { version = "1", features = ["v4"] }
keyring     = "2"
# P2-24 / P2-70. Two additions, both required by tasks in this phase:
#   aes-gcm — the encrypted-file vault fallback for Linux hosts with no Secret
#             Service. `deb` and `appimage` are shipped bundle targets, so this
#             is a real configuration, not a hypothetical one.
#   zeroize — so a secret pulled from the keychain to answer a yes/no question
#             does not linger in process memory afterwards.
aes-gcm     = "0.10"
zeroize     = { version = "1", features = ["zeroize_derive"] }
serde_yaml  = "0.9"
base64      = "0.22"
tokio       = { version = "1", features = ["full"] }
regex       = "1"
git2        = "0.19"
glob        = "0.3"
walkdir     = "2"
notify      = "6"
hex         = "0.4"
flate2      = "1"
dirs        = "5"
sysinfo     = "0.33"
toml        = "0.8"
rayon       = "1.10"
sha2        = "0.10"
rhai        = { version = "1", features = ["sync"] }
semver      = "1"
tempfile    = "3"
tree-sitter = "0.22"
petgraph    = "0.6"
ignore      = "0.4"
cron        = "0.12"

[dev-dependencies]
# Deterministic paused-clock coverage for the production worker-run deadline.
tokio = { version = "1", features = ["test-util"] }
syn = { version = "2.0.117", features = ["full", "visit"] }

[target.'cfg(windows)'.dependencies]
flatbuffers = "=25.12.19"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Security_Cryptography",
    "Win32_Security_WinTrust",
    "Win32_Storage_FileSystem",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

