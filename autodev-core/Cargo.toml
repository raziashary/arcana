[package]
name = "autodev-core"
version = "1.0.0"
edition = "2021"
description = "AutoDev's agent runtime, providers, memory and platform layer — shared by the desktop app and the CLI, and free of any UI framework."

[features]
# The live provider smoke (P2-69). OFF by default and never enabled by the app.
#
# Fixture tests are the CI default because they need no credentials -- but a
# fixture is a photograph: it freezes the vendor wire format at capture time and
# goes on passing forever, including on the day a field is renamed. This feature
# gates the only tests that can see that drift, and the only ones that can prove
# prompt caching engages (usage.cached_read is not observable from the request).
#
# It spends real money. Run it deliberately:
#   cargo test -p autodev-core --features live-smoke --test live_provider_smoke -- --nocapture
live-smoke = []

[dependencies]
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
anyhow      = "1"
tracing     = "0.1"
chrono      = { version = "0.4", features = ["serde"] }
rusqlite    = { version = "0.31", features = ["bundled"] }
reqwest     = { version = "0.12", features = ["json", "stream"] }
async-trait = "0.1"
futures     = "0.3"
uuid        = { version = "1", features = ["v4"] }
keyring     = "2"
# P2-24 / P2-70. Two additions, both required by tasks in this phase:
#   aes-gcm — the encrypted-file vault fallback for Linux hosts with no Secret
#             Service. `deb` and `appimage` are shipped bundle targets, so this
#             is a real configuration, not a hypothetical one.
#   zeroize — so a secret pulled from the keychain to answer a yes/no question
#             does not linger in process memory afterwards.
aes-gcm     = "0.10"
zeroize     = { version = "1", features = ["zeroize_derive"] }
serde_yaml  = "0.9"
base64      = "0.22"
tokio       = { version = "1", features = ["full"] }
regex       = "1"
git2        = "0.19"
glob        = "0.3"
walkdir     = "2"
notify      = "6"
hex         = "0.4"
flate2      = "1"
dirs        = "5"
sysinfo     = "0.33"
toml        = "0.8"
rayon       = "1.10"
sha2        = "0.10"
rhai        = { version = "1", features = ["sync"] }
semver      = "1"
tempfile    = "3"
tree-sitter = "0.22"
petgraph    = "0.6"
ignore      = "0.4"
cron        = "0.12"

