[package]
name = "autodev"
version = "1.0.0"
description = "AutoDev — AI Agent Desktop Platform for AIRS Foundry"
authors = ["AIRS Foundry"]
edition = "2021"

[lib]
name = "autodev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "autodev"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri              = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow    = "1"
thiserror = "1"

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender   = "0.2"   # Phase 7.3 — daily rolling file rotation

# Database (session persistence)
rusqlite = { version = "0.31", features = ["bundled"] }

# OS keychain (vault)
keyring = "2"

# HTTP client (provider API calls)
reqwest = { version = "0.12", features = ["json", "stream"] }

# MCP protocol (official Rust SDK) — Phase 3.4
rmcp = { version = "0.16", features = ["server", "transport-streamable-http-server"] }

# HTTP framework for MCP Streamable HTTP transport
axum = "0.8"

# Utilities
uuid   = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Async helpers
futures     = "0.3"
async-trait = "0.1"

# File operations (for new tools)
glob     = "0.3"
walkdir  = "2"
regex    = "1"

# YAML (for recipe parsing)
serde_yaml = "0.9"

# Cron expression parsing (for recipe scheduler)
cron = "0.12"

# Native file/folder picker dialogs (for workspace dir selection)
rfd = { version = "0.15", features = ["tokio"] }

# git2-rs — Phase 3 (already declared to lock dep version)
git2 = "0.19"

# Process resource monitoring (CPU%, memory) — Phase 3.4b SidecarPanel
sysinfo = "0.33"

# Ollama local LLM provider — Phase X
# Task D3: Keep 0.3.4; panic prevention via D1 (sanitized OLLAMA_HOST) + D2 (catch_unwind)
ollama-rs = { version = "0.3.4", features = ["stream"] }

# Graph Engine — Phase 6
tree-sitter = "0.22"
petgraph = "0.6"
sha2 = "0.10"
rayon = "1.10"
ignore = "0.4"
hex = "0.4"
notify = "6"
dirs = "5"
flate2 = "1"
base64 = "0.22"

[package.metadata.tauri]
# This section is required by tauri-build to locate icons and capabilities
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
