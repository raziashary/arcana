[package]
name = "autodev"
version = "1.0.0"
description = "AutoDev — AI Agent Desktop Platform for AIRS Foundry"
authors = ["AIRS Foundry"]
edition = "2021"

[lib]
name = "autodev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "autodev"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri              = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow    = "1"
thiserror = "1"

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Database (session persistence)
rusqlite = { version = "0.31", features = ["bundled"] }

# OS keychain (vault)
keyring = "2"

# HTTP client (provider API calls)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Utilities
uuid   = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

# Async helpers
futures     = "0.3"
async-trait = "0.1"

# File operations (for new tools)
glob     = "0.3"
walkdir  = "2"
regex    = "1"

# git2-rs — Phase 3 (already declared to lock dep version)
git2 = "0.19"

[package.metadata.tauri]
# This section is required by tauri-build to locate icons and capabilities
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
