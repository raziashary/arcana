[package]
name = "autodev"
version = "1.0.0"
description = "AutoDev — AI Agent Desktop Platform for AIRS Foundry"
authors = ["AIRS Foundry"]
edition = "2021"

[lib]
name = "autodev_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "autodev"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri core
tauri              = { version = "2.11", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"

# Serialization
autodev-core = { path = "../autodev-core" }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow    = "1"

# Logging / tracing
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender   = "0.2"   # Phase 7.3 — daily rolling file rotation

# Database (session persistence)
rusqlite = { version = "0.31", features = ["bundled"] }

# OS keychain (vault)
keyring = "2"

# HTTP client (provider API calls)
reqwest = { version = "0.12", features = ["json", "stream"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }

# Async helpers
futures     = "0.3"
async-trait = "0.1"

# File operations (for new tools)
glob     = "0.3"
walkdir  = "2"
regex    = "1"

# YAML (for recipe parsing)
serde_yaml = "0.9"

# TOML parsing (for validate.rs Tier 1 syntax check)
toml = "0.8"

# Cron expression parsing (for recipe scheduler)
cron = "0.12"

# Native file/folder picker dialogs (for workspace dir selection)
# Pinned to v0.14 with NO tokio feature. rfd's default xdg-portal feature enables
# ashpd/async-std; adding features= ["tokio"] also enables ashpd/tokio — ashpd
# compile_error!()s when both runtimes are active simultaneously. Dropping the tokio
# feature is safe: AsyncFileDialog spawns its dialog on a dedicated thread and the
# resulting Future is executor-agnostic, so .await works fine in a tokio context.
rfd = { version = "0.14" }

# git2-rs — Phase 3 (already declared to lock dep version)

# Process resource monitoring (CPU%, memory) — Phase 3.4b SidecarPanel

# Ollama local LLM provider — Phase X
# Task D3: Keep 0.3.4; panic prevention via D1 (sanitized OLLAMA_HOST) + D2 (catch_unwind)

# Hook custom_condition expression evaluator — Phase 3.1

# Auto-updater — Phase 5.3
ed25519-dalek = { version = "2", features = ["std"] }
semver = "1"
tempfile = "3"

# Graph Engine — Phase 6
sha2 = "0.10"
ignore = "0.4"
hex = "0.4"
notify = "6"
dirs = "5"
base64 = "0.22"


[package.metadata.tauri]
# This section is required by tauri-build to locate icons and capabilities
icons = ["icons/32x32.png", "icons/128x128.png", "icons/128x128@2x.png", "icons/icon.icns", "icons/icon.ico"]

# ⚠ The `[profile.release]` block that lived here was **moved to the workspace
# root** in `P3-01`. Cargo ignores `[profile.*]` in a non-root member and warns
# on every invocation, so none of it — including `panic = "abort"` — was ever in
# effect. Do not re-add it here; see the root `Cargo.toml`.
