name: CI

# INV-4: a gate that cannot fail is not a gate.
#
# Every correctness check in this file is blocking. There is no
# `continue-on-error` anywhere, by design — four of them used to sit on
# `cargo fmt` and `cargo test` for both Rust crates, so the entire ~415-defect
# register accumulated behind a green tick.
#
# Two further things this file used to get wrong:
#   • the "ESLint" step ran `npm run lint`, which was literally `tsc --noEmit` —
#     the same command the step above it already ran, reported twice
#   • `cargo test --lib` runs only unit tests inside the library target, so
#     anything in `src-tauri/tests/` would never run while still reporting green

on:
  push:
    branches: [main, develop, 'feature/**', 'phase/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Use Node.js 24 as the action runtime to silence the Node 20 deprecation
  # warning emitted by actions/checkout and actions/setup-node themselves.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

  # ── Rust checks (fast — no platform UI deps) ──────────────────────────────

  rust-checks:
    name: Rust lint & test (whole workspace)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config \
            lld

      - name: Install Rust stable + components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      # --all / --workspace, not a single manifest. The workspace has THREE
      # members and this job used to check one: `src-shared` was never
      # formatted or linted by any job, so `cargo fmt --all` failed while the
      # src-tauri-only check passed. Found by the P0 post-phase audit (F-15).
      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # --all-targets, not --lib: integration tests under src-tauri/tests/ must
      # actually run. With --lib they are silently skipped and the job is green.
      - name: Tests
        run: cargo test --workspace --all-targets -- --test-threads=4

      # TG-P1-03 - the crate boundary, checked transitively.
      #
      # `cargo tree` sees through re-exports, path dependencies and feature
      # unification, none of which the in-tree text gates (TG-P1-01/02) can
      # observe: those read Cargo.toml and the .rs files, so a Tauri edge
      # arriving through a third crate would pass both.
      #
      # It runs in CI rather than inside `cargo test`, where spawning cargo
      # would contend for the build lock the running test already holds.
      #
      # It lives in this job because the whole workspace is already resolved
      # here. The independent real-world proof is `cli-checks`, which installs
      # no GTK or webkit at all - if core ever took a Tauri dependency, that
      # job could not link arcanactl. This step exists so the failure says what
      # went wrong instead of surfacing as a missing system library.
      - name: Crate boundary - arcana-core must not depend on Tauri
        run: |
          set -euo pipefail
          for crate in arcana-core arcanactl; do
            echo "-- $crate"
            hits=$(cargo tree -p "$crate" | awk 'tolower($0) ~ /tauri|gtk|webkit|glib/ {n++} END {print n+0}')
            if [ "$hits" -ne 0 ]; then
              echo "::error::$crate has $hits UI-framework dependencies. Core is linked by arcanactl, which cannot link a UI framework - see ADR-LOG-RESTRUCT-0011."
              cargo tree -p "$crate" | awk 'tolower($0) ~ /tauri|gtk|webkit|glib/'
              exit 1
            fi
          done
          # Prove the check can see a dependency when one exists, so a broken
          # grep cannot leave this step permanently and silently green.
          desktop=$(cargo tree -p arcana | awk 'tolower($0) ~ /tauri/ {n++} END {print n+0}')
          if [ "$desktop" -eq 0 ]; then
            echo "::error::found no tauri dependency in the desktop crate - this check is not working"
            exit 1
          fi
          echo "core and CLI are UI-free; desktop has $desktop tauri edges"

  # ── Frontend lint, typecheck and unit tests ───────────────────────────────

  frontend-checks:
    name: Frontend lint, typecheck & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      # `npm run lint` is now `eslint .`. Before P0 it was `tsc --noEmit`, so
      # this step re-ran the one above it and called the result linting.
      - name: ESLint
        run: npm run lint

      - name: Unit tests
        run: npm test

  # ── CLI checks ─────────────────────────────────────────────────────────────

  cli-checks:
    name: CLI lint & test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libssl-dev pkg-config lld

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-cli -> target

      - name: Format check
        run: cargo fmt --manifest-path src-cli/Cargo.toml -- --check

      - name: Clippy
        run: |
          cargo clippy \
            --manifest-path src-cli/Cargo.toml \
            --all-targets

      - name: Tests
        run: |
          cargo test \
            --manifest-path src-cli/Cargo.toml \
            --all-targets \
            -- --test-threads=4

  # ── Build smoke: all three platforms, on pull requests ────────────────────
  #
  # These used to be gated to `push` on `main`, so a pull request could be
  # merged without any platform ever having compiled the app — and macOS was
  # not built in CI at all. R-4 names "macOS verified last" as release-blocking.

  build-smoke:
    name: Build smoke (${{ matrix.name }})
    needs: [rust-checks, frontend-checks]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-14   # Apple Silicon

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev pkg-config xvfb

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python command corpus tools
        run: python -m pip install pytest ruff

      # Core unit-test executables cannot enter the private Windows process
      # bridge mode. Build the shipped CLI bridge in this same job before any
      # production sandbox command corpus invokes it.
      - name: Build Windows sandbox bridge
        if: runner.os == 'Windows'
        run: cargo build -p arcanactl --locked

      # TG4-17: exercise the production read/write boundaries for saved
      # workflows and defaults on every supported host. The skill loader is
      # part of the desktop crate; running these tests in this matrix ensures
      # Linux and macOS do not silently skip the persisted-skill contract.
      - name: Persisted workflow shell portability (TG4-17)
        shell: bash
        run: |
          set -euo pipefail
          cargo test -p arcana-core --lib platform::shell_portability::tests --locked -- --test-threads=1
          cargo test -p arcana-core --lib portability_tests --locked -- --test-threads=1
          cargo test -p arcana-core --lib tg4_17_shipped_recipe_prompts_do_not_embed_posix_shell_or_tmp_commands --locked -- --test-threads=1
          cargo test -p arcana-core --lib persisted_builtin_recipes_pass_the_production_reader_portability_check --locked -- --test-threads=1
          cargo test -p arcana --lib skills::loader::portability_tests --locked -- --test-threads=1
          cargo test -p arcana --lib skills::defaults::tg4_17_tests --locked -- --test-threads=1

      # TG4-21: execute the real AnalyticsDb and HooksDb cleanup paths while a
      # second SQLite connection owns an immediate writer transaction. Keep
      # this in the three-OS matrix so WAL/busy-timeout behavior is exercised
      # on every supported desktop target.
      - name: Append-only retention waits for active writers
        run: cargo test -p arcana-core --lib serializes_with_an_active_database_writer --locked -- --nocapture --test-threads=1

      # TG4-18: run Rust, npm and Python command intents through Arcana's
      # production argv resolver and process launcher on each OS in this
      # matrix, including the real Windows npm.cmd shim path.
      - name: Project command portability corpora
        run: cargo test -p arcana-core --lib agent::builtin_tools::project_command::tests::checked_in_ecosystem_corpora_run_real_intents_through_the_production_launcher --locked -- --exact --nocapture

      - name: Install deps
        run: npm ci

      - name: Build (debug, no bundle)
        run: npm run tauri -- build --debug --no-bundle

      # COMPILING IS NOT STARTING. Nothing else in this workflow executes the
      # binary — the other build jobs stop at `cargo build` — so an app that
      # compiles perfectly and then dies during setup() was invisible here.
      #
      # Not hypothetical: registering tauri-plugin-dialog made Tauri parse a
      # `"dialog": {}` config block the plugin cannot deserialize (its config
      # type is unit), and the app failed at launch on every platform while all
      # three build smokes stayed green.
      #
      # Cheap and webdriver-free: start it, wait, require it to still be alive.
      # `timeout` exits 124 when it had to kill a LIVING process; any other exit
      # code means the app quit on its own, which is the failure.
      - name: Launch smoke (Linux) — the app must START, not just compile
        if: runner.os == 'Linux'
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: |
          # `|| code=$?` captures the exit status WITHOUT disabling errexit.
          # The first version used `set +e`, which this workflow's own gate
          # correctly flags as a way to neutralise a failing step — the fix is
          # to not need the exception, not to exempt it.
          code=0
          timeout 20 xvfb-run --auto-servernum ./target/debug/arcana > app-launch.log 2>&1 || code=$?
          if [ "$code" -eq 124 ]; then
            echo "OK - the application was still running after 20s"
          else
            echo "::error::The application exited on its own with code $code - it does not start."
            echo "----- application output -----"
            cat app-launch.log
            exit 1
          fi

  # ── End-to-end smoke against the built binary ─────────────────────────────
  #
  # Linux only: tauri-driver has no WKWebView backend, so macOS cannot run this
  # harness at all, and Windows needs an Edge WebDriver matching the runner's
  # Edge build. Stated in e2e/README.md rather than hidden behind a skip that
  # would report green.

  e2e-smoke:
    name: End-to-end smoke (Linux)
    needs: [build-smoke]
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev pkg-config \
            webkit2gtk-driver xvfb

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build the application
        run: npm run tauri -- build --debug --no-bundle

      # WebKitGTK will not come up under Xvfb with its default renderer: the
      # session is created, the app is launched, and it never becomes
      # driveable — which surfaces as an 8-minute `Request timed out` at
      # POST /session rather than as a crash. Both flags are the standard
      # headless-CI workaround.
      - name: Run the end-to-end smoke
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
        run: xvfb-run --auto-servernum npm run test:e2e
