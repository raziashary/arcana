name: CI

on:
  push:
    branches: [main, develop, 'feature/**', 'phase/**']
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:

  # ── Rust checks (fast — no platform UI deps) ──────────────────────────────

  rust-checks:
    name: Rust lint & test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust stable + components
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Clippy
        run: |
          cargo clippy \
            --manifest-path src-tauri/Cargo.toml \
            --all-targets

      - name: Tests
        run: |
          cargo test \
            --manifest-path src-tauri/Cargo.toml \
            --lib \
            -- --test-threads=4

  # ── Frontend type-check ───────────────────────────────────────────────────

  frontend-checks:
    name: Frontend lint & typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

  # ── CLI checks ─────────────────────────────────────────────────────────────

  cli-checks:
    name: CLI lint & test
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-cli -> src-cli/target

      - name: Format check
        run: cargo fmt --manifest-path src-cli/Cargo.toml -- --check

      - name: Clippy
        run: |
          cargo clippy \
            --manifest-path src-cli/Cargo.toml \
            --all-targets

      - name: Tests
        run: |
          cargo test \
            --manifest-path src-cli/Cargo.toml \
            -- --test-threads=4

  # ── Tauri build smoke test (Windows) ─────────────────────────────────────

  build-smoke-windows:
    name: Build smoke (Windows)
    needs: [rust-checks, frontend-checks]
    runs-on: windows-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build (debug, no bundle)
        run: npm run tauri -- build --debug --no-bundle

  # ── Tauri build smoke test (Linux) ───────────────────────────────────────

  build-smoke-linux:
    name: Build smoke (Linux)
    needs: [rust-checks, frontend-checks]
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            libssl-dev pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build (debug, no bundle)
        run: npm run tauri -- build --debug --no-bundle
