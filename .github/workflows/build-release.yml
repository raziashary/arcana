name: Build & Release

# Triggered by a version tag push: v1.2.3, v1.2.3-beta.1, v1.2.3-nightly
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta*'
      - 'v[0-9]+.[0-9]+.[0-9]+-nightly*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v1.2.3)'
        required: true
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options: [stable, beta, nightly]
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  # Update server public key (Ed25519) — set in repo secrets
  AUTODEV_UPDATE_PUBKEY: ${{ secrets.AUTODEV_UPDATE_PUBKEY }}

jobs:

  # ── Determine release metadata ─────────────────────────────────────────────

  metadata:
    name: Release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      channel: ${{ steps.meta.outputs.channel }}
      tag:     ${{ steps.meta.outputs.tag }}
      draft:   ${{ steps.meta.outputs.draft }}

    steps:
      - name: Determine version / channel / tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            CHANNEL="${{ github.event.inputs.channel }}"
            DRAFT="${{ github.event.inputs.draft }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            DRAFT="false"
            if [[ "$TAG" == *"-beta"* ]]; then
              CHANNEL="beta"
            elif [[ "$TAG" == *"-nightly"* ]]; then
              CHANNEL="nightly"
            else
              CHANNEL="stable"
            fi
          fi

          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "draft=$DRAFT"     >> "$GITHUB_OUTPUT"

          echo "Building $TAG ($CHANNEL)"

  # ── Create GitHub Release (draft) ─────────────────────────────────────────

  create-release:
    name: Create GitHub Release
    needs: metadata
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ needs.metadata.outputs.tag }}" \
            --title "AutoDev ${{ needs.metadata.outputs.version }}" \
            --generate-notes \
            ${{ needs.metadata.outputs.draft == 'true' && '--draft' || '' }} \
            ${{ needs.metadata.outputs.channel != 'stable' && '--prerelease' || '' }}

  # ── Windows MSI ───────────────────────────────────────────────────────────

  build-windows:
    name: Build Windows MSI
    needs: [metadata, create-release]
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> src-tauri/target

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install WiX v4
        run: dotnet tool install --global wix

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@latest

      - name: Install frontend deps
        run: npm ci

      - name: Build MSI
        env:
          AUTODEV_CHANNEL: ${{ needs.metadata.outputs.channel }}
          CERT_PATH:       ${{ secrets.WINDOWS_CERT_PATH }}
          CERT_PASSWORD:   ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $sign = if ("$env:CERT_PATH" -ne "") { "-Sign" } else { "" }
          powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1 `
            -Channel ${{ needs.metadata.outputs.channel }} `
            $sign

      - name: Upload MSI to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG:  ${{ needs.metadata.outputs.tag }}
        run: |
          foreach ($f in Get-ChildItem dist -Filter "*.msi") {
            gh release upload $env:RELEASE_TAG $f.FullName --clobber
          }
          foreach ($f in Get-ChildItem dist -Filter "*.sha256") {
            gh release upload $env:RELEASE_TAG $f.FullName --clobber
          }

  # ── macOS DMG ─────────────────────────────────────────────────────────────

  build-macos:
    name: Build macOS DMG
    needs: [metadata, create-release]
    runs-on: macos-14   # Apple Silicon runner
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Expose the secret as an env var so it can be tested in the if: condition below.
      # GitHub Actions does NOT allow `secrets.*` directly in step if: expressions.
      - name: Check code-signing cert availability
        id: check_cert
        env:
          CERT_BASE64: ${{ secrets.APPLE_CERT_BASE64 }}
        run: |
          if [[ -n "${CERT_BASE64:-}" ]]; then
            echo "available=true"  >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import code-signing certificate
        if: steps.check_cert.outputs.available == 'true'
        env:
          CERT_BASE64:    ${{ secrets.APPLE_CERT_BASE64 }}
          CERT_PASSWORD:  ${{ secrets.APPLE_CERT_PASSWORD }}
          KEYCHAIN_PASS:  ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          echo "$CERT_BASE64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          rm /tmp/cert.p12

      - name: Build DMG
        env:
          AUTODEV_CHANNEL:   ${{ needs.metadata.outputs.channel }}
          SIGNING_IDENTITY:  ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID:          ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID:     ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          SIGN_FLAG=""
          NOTARIZE_FLAG=""
          [[ -n "${SIGNING_IDENTITY:-}" ]] && SIGN_FLAG="--sign"
          [[ -n "${APPLE_ID:-}" ]]         && NOTARIZE_FLAG="--notarize"
          bash scripts/build-macos.sh $SIGN_FLAG $NOTARIZE_FLAG \
            --channel ${{ needs.metadata.outputs.channel }}

      - name: Upload DMG to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG:  ${{ needs.metadata.outputs.tag }}
        run: |
          for f in dist/*.dmg dist/*.sha256; do
            [[ -f "$f" ]] || continue
            gh release upload "$RELEASE_TAG" "$f" --clobber
          done

  # ── Linux AppImage + .deb ─────────────────────────────────────────────────

  build-linux:
    name: Build Linux (AppImage + deb)
    needs: [metadata, create-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            libfuse2

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Build AppImage + deb
        env:
          AUTODEV_CHANNEL: ${{ needs.metadata.outputs.channel }}
        run: |
          bash scripts/build-linux.sh \
            --all \
            --channel ${{ needs.metadata.outputs.channel }}

      - name: Upload Linux artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG:  ${{ needs.metadata.outputs.tag }}
        run: |
          for f in dist/*.AppImage dist/*.deb dist/*.sha256; do
            [[ -f "$f" ]] || continue
            gh release upload "$RELEASE_TAG" "$f" --clobber
          done

  # ── Publish release ───────────────────────────────────────────────────────

  # ── Sign and checksum the built artifacts ──────────────────────────────────
  #
  # AutoDev REFUSES to install an update that has no detached Ed25519 signature
  # and no SHA-256 checksum (src-tauri/src/updater/verify.rs — both are hard
  # failures in every build profile). Producing them is therefore part of
  # releasing, not an optional extra: a release published without these assets
  # cannot be installed by any client. See ADR-LOG-RESTRUCT-0003.
  sign-release:
    name: Sign release artifacts
    needs: [metadata, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Require the signing key
        env:
          PRIVKEY: ${{ secrets.AUTODEV_UPDATE_PRIVKEY }}
        run: |
          if [ -z "$PRIVKEY" ]; then
            echo "::error::AUTODEV_UPDATE_PRIVKEY is not set. Releases cannot be" \
                 "signed, and an unsigned release is uninstallable. See" \
                 "docs/updater-signing.md for key generation and setup."
            exit 1
          fi

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "${{ needs.metadata.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" --dir dist
          ls -1 dist

      - name: Sign and checksum every installer
        env:
          PRIVKEY: ${{ secrets.AUTODEV_UPDATE_PRIVKEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          umask 077
          KEY="$RUNNER_TEMP/update-signing.pem"
          printf '%s' "$PRIVKEY" > "$KEY"
          trap 'rm -f "$KEY"' EXIT

          signed=0
          for f in dist/*.msi dist/*.exe dist/*.dmg dist/*.AppImage dist/*.deb; do
            openssl pkeyutl -sign -inkey "$KEY" -rawin -in "$f" -out "$f.sig"
            # The checksum sidecar is regenerated here for every platform so the
            # three build jobs cannot disagree about its format.
            ( cd dist && sha256sum "$(basename "$f")" > "$(basename "$f").sha256" )
            echo "signed + checksummed $(basename "$f")"
            signed=$((signed + 1))
          done

          if [ "$signed" -eq 0 ]; then
            echo "::error::No installer artifacts were found to sign."
            exit 1
          fi
          echo "signed $signed artifact(s)"

      # A signature that does not verify is worse than none: it would ship a
      # release every client refuses. Prove it here, with the same public key
      # the application compiles in.
      - name: Verify the signatures before publishing
        env:
          PUBKEY: ${{ secrets.AUTODEV_UPDATE_PUBKEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [ -z "$PUBKEY" ]; then
            echo "::error::AUTODEV_UPDATE_PUBKEY is not set, so the signatures" \
                 "cannot be checked against the key the app embeds."
            exit 1
          fi

          # Rebuild a DER public key from the raw 32 bytes the app embeds.
          printf '302a300506032b6570032100' > "$RUNNER_TEMP/pub.hex"
          printf '%s' "$PUBKEY" | base64 -d | xxd -p -c 32 >> "$RUNNER_TEMP/pub.hex"
          tr -d '\n' < "$RUNNER_TEMP/pub.hex" | xxd -r -p > "$RUNNER_TEMP/pub.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/pub.der" \
                  -out "$RUNNER_TEMP/pub.pem"

          for sig in dist/*.sig; do
            artifact="${sig%.sig}"
            openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/pub.pem" \
                    -rawin -in "$artifact" -sigfile "$sig"
            echo "verified $(basename "$sig")"
          done

      - name: Upload signatures and checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ needs.metadata.outputs.tag }}" \
            dist/*.sig dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" --clobber

  publish-release:
    name: Publish release
    needs: [metadata, build-windows, build-macos, build-linux, sign-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: ${{ needs.metadata.outputs.draft == 'false' }}

    steps:
      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ needs.metadata.outputs.tag }}" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false
